# === SETTING YANG SUDAH ADA (tetap dipertahankan) ===
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# === TAMBAHAN OPTIMASI ===

# 1. Aktifkan Gradle Daemon (biar build kedua dst cepat)
org.gradle.daemon=true

# 2. Jalankan task paralel (multi-module lebih cepat)
org.gradle.parallel=true

# 3. Cache hasil build (gak rebuild ulang kalau gak berubah)
org.gradle.caching=true

# 4. Configure on demand (hanya build module yang berubah)
org.gradle.configureondemand=true

# 5. Batasin jumlah worker sesuai core (opsional)
org.gradle.workers.max=4

# 6. Matikan build scan (kirim data ke gradle.com, bikin lambat)
org.gradle.internal.launcher.welcomeMessageDisplayed=false